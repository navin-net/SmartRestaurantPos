spring.application.name=SmartRestaurant
# Load .env from the working directory and from the project subfolder, so the
# app works whether it is started from the repo root or from SmartRestaurantPos/.
spring.config.import=optional:file:.env[.properties],optional:file:SmartRestaurantPos/.env[.properties]

server.port=8080

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:${POSTGRES_DB:smartrestaurant}}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway
# Existing databases were created by Hibernate before Flyway was added, so
# baseline them instead of failing. baseline-version=0 keeps V1 available for
# a future migration. If the schema is fully managed by Hibernate/JPA and you
# are not writing migrations yet, set spring.flyway.enabled=false instead.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Apply Picture
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

#JWT Token
security.jwt.secret-key=${JWT_SECRET}
# 30 minutes in milliseconds
security.jwt.expiration-time=1800000